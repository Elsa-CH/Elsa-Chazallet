<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elsa Chazallet — Portfolio</title>
  <meta name="description" content="Portfolio d'Elsa Chazallet : projets visuels, sonores, performatifs, design et transversaux.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================================================
       EN-TÊTE
       ========================================================= -->

  <header class="site-header">
    <img src="images/images/elsachazallet.png" alt="" class="header-image">
  </header>

  <!-- =========================================================
       COMMANDES INVISIBLES (ONGLETS)
       ========================================================= -->

  <input type="radio" name="tab" id="tab-galerie" checked>
  <input type="radio" name="tab" id="tab-apropos">
  <input type="radio" name="tab" id="tab-cv">
  <input type="radio" name="tab" id="tab-contacts">
  <input type="radio" name="tab" id="tab-boutique">

  <!-- =========================================================
       COMMANDES INVISIBLES (GALERIE : MODES + FILTRES)
       ========================================================= -->

  <input type="radio" name="ecg-mode" id="ecg-tri" checked>
  <input type="radio" name="ecg-mode" id="ecg-vrac">

  <input type="radio" name="ecg-filtre" id="ecg-tout" checked>
  <input type="radio" name="ecg-filtre" id="ecg-visuel">
  <input type="radio" name="ecg-filtre" id="ecg-sonore">
  <input type="radio" name="ecg-filtre" id="ecg-performatif">
  <input type="radio" name="ecg-filtre" id="ecg-design">
  <input type="radio" name="ecg-filtre" id="ecg-transversal">

  <main class="page">

    <!-- =====================================================
         BARRE D'ONGLETS
         ===================================================== -->

    <nav class="tabs" role="tablist">
      <label class="tab" for="tab-galerie">Galerie des Projets</label>
      <label class="tab" for="tab-apropos">À propos</label>
      <label class="tab" for="tab-cv">Curriculum Vitae</label>
      <label class="tab" for="tab-contacts">Contacts</label>
      <label class="tab" for="tab-boutique">Boutique</label>
    </nav>

    <!-- =====================================================
         ONGLET : GALERIE DES PROJETS
         ===================================================== -->

    <section class="panel" id="panel-galerie">

      <div class="ecg">

        <!-- BARRE DES MODES -->

        <div class="ecg-bar">
          <label class="ecg-mode" for="ecg-tri">Cloisonné</label>
          <label class="ecg-mode" for="ecg-vrac">Décloisonné</label>
        </div>

        <!-- FILTRES -->

        <div class="ecg-chips">
          <label class="ecg-chip" for="ecg-tout">Tout</label>
          <label class="ecg-chip" for="ecg-visuel">Visuel</label>
          <label class="ecg-chip" for="ecg-sonore">Sonore</label>
          <label class="ecg-chip" for="ecg-performatif">Performatif</label>
          <label class="ecg-chip" for="ecg-design">Design</label>
          <label class="ecg-chip" for="ecg-transversal">Transversal</label>
        </div>

        <!-- GALERIE -->

        <div class="ecg-grid">

          <!-- ŒUVRE 1 -->
          <a class="ecg-card visuel" href="#">
            <img src="images/oeuvre-1.jpg" alt="Sans titre 1">
            <div class="ecg-overlay">
              <span class="ecg-cat">Visuel</span>
              <h3 class="ecg-t">Sans titre 1</h3>
            </div>
          </a>

          <!-- ŒUVRE 2 -->
          <a class="ecg-card visuel" href="#">
            <img src="images/oeuvre-2.jpg" alt="Sans titre 2">
            <div class="ecg-overlay">
              <span class="ecg-cat">Visuel</span>
              <h3 class="ecg-t">Sans titre 2</h3>
            </div>
          </a>

          <!-- ŒUVRE 3 -->
          <a class="ecg-card performatif" href="#">
            <img src="images/oeuvre-3.jpg" alt="Sans titre 3">
            <div class="ecg-overlay">
              <span class="ecg-cat">Performatif</span>
              <h3 class="ecg-t">Sans titre 3</h3>
            </div>
          </a>

        </div>

      </div>

    </section>

    <!-- =====================================================
         ONGLET : À PROPOS
         ===================================================== -->

    <section class="panel" id="panel-apropos">
      <h2>À propos</h2>
      <p>Texte de présentation à venir.</p>
    </section>

    <!-- =====================================================
         ONGLET : CURRICULUM VITAE
         ===================================================== -->

    <section class="panel" id="panel-cv">
      <h2>Curriculum Vitae</h2>
      <p>Contenu du CV à venir.</p>
    </section>

    <!-- =====================================================
         ONGLET : CONTACTS
         ===================================================== -->

    <section class="panel" id="panel-contacts">
      <h2>Contacts</h2>
      <p>
        Email : <a href="mailto:exemple@domaine.fr">exemple@domaine.fr</a><br>
        Instagram : <a href="#">@ton-compte</a>
      </p>
    </section>

    <!-- =====================================================
         ONGLET : BOUTIQUE
         ===================================================== -->

    <section class="panel" id="panel-boutique">
      <h2>Boutique</h2>
      <p>La boutique arrive bientôt.</p>
    </section>

  </main>

</body>
</html>
